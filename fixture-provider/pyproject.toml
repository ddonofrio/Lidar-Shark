[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="lidar-fixture-provider"
version="1.0.0"
requires-python=">=3.12"
dependencies=["lidar-sdk>=1.0,<2"]
[project.entry-points."lidar_sdk.providers"]
fixture="fixture_provider:FixtureProvider"
[tool.setuptools]
py-modules=["fixture_provider"]
