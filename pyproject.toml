[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lidar-shark"
version = "0.1.0"
description = "Interactive SDK-driven 2D LiDAR viewer"
requires-python = ">=3.12"
dependencies = ["lidar-sdk>=1.0,<2", "PySide6>=6.8", "pyqtgraph>=0.13"]
[project.scripts]
lidar-shark = "lidar_shark.app:main"
[tool.setuptools]
packages = ["lidar_shark"]
package-dir = {lidar_shark = "src"}
data-files = {"share/lidar-shark" = ["assets/logo.png"]}
